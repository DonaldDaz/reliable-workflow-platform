name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Java unit tests
        run: mvn -q test
        working-directory: backend
      - name: Angular production build
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: console
      - name: Start integration stack
        run: docker compose up -d --build
      - name: Wait for API
        run: |
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://localhost:8092/actuator/health | grep -q '"status":"UP"'; then exit 0; fi
            sleep 2
          done
          docker compose logs api
          exit 1
      - name: Verify workflow and recovery
        run: python3 scripts/verify-recovery.py
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down -v
